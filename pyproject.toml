[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dgpt"
version = "0.1.0"
description = "Decentralized volunteer-compute training of a small GPT: one coordinator, many workers, plain HTTP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "requests>=2.31",
  "pydantic>=2",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.scripts]
dgpt-worker = "worker:main"
dgpt-coordinator = "coordinator:main"

[tool.setuptools]
py-modules = ["model", "data", "config", "merge", "protocol", "auth", "worker", "coordinator", "evaluate"]
